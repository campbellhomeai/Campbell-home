<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Campbell Home Concierge</title>

<style>

:root{
--gold:#e8c07a;
--gold-light:#ffe7b0;
--white:#ffffff;
--dark:rgba(8,12,18,.82);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, Helvetica, sans-serif;
color:white;
overflow:hidden;
}

.kiosk{
height:100vh;
background:
linear-gradient(
rgba(0,0,0,.45),
rgba(0,0,0,.55)
),
url("nyc-sunset.jpg.PNG");
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
}

.container{
width:100%;
max-width:1000px;
text-align:center;
padding:20px;
display:flex;
flex-direction:column;
height:100vh;
}

/* LOGO */

.logo-wrap{
margin-top:10px;
}

.logo{
width:95px;
height:95px;
margin:auto;
position:relative;
}

.logo-c{
position:absolute;
inset:0;
border:6px solid var(--gold);
border-right-color:transparent;
border-radius:50%;
}

.logo-home{
position:absolute;
left:23px;
top:24px;
width:42px;
height:42px;
color:var(--gold-light);
}

.brand{
font-family:Georgia, serif;
font-size:64px;
letter-spacing:.12em;
color:var(--gold);
margin-top:8px;
}

.subtitle{
letter-spacing:.25em;
font-size:18px;
margin-top:5px;
}

.slogan{
margin-top:12px;
color:white;
font-weight:600;
letter-spacing:.12em;
text-transform:uppercase;
}

/* CLOCK AND WEATHER */

.info-row{
display:flex;
justify-content:center;
align-items:center;
gap:60px;
margin-top:30px;
}

.time{
font-size:72px;
font-weight:300;
}

.date{
font-size:20px;
margin-top:8px;
}

.weather{
display:flex;
align-items:center;
gap:15px;
}

.weather-icon{
font-size:55px;
}

.temperature{
font-size:64px;
}

.weather-text{
font-size:18px;
}

/* WELCOME */

.welcome{
margin-top:35px;
font-size:48px;
font-family:Georgia, serif;
font-weight:600;
text-shadow:0 3px 12px rgba(0,0,0,.5);
}

/* QR */

.qr-section{
margin-top:12px;
}

.qr-box{
width:250px;
height:250px;
background:white;
margin:auto;
border-radius:22px;
padding:10px;
border:3px solid var(--gold);
box-shadow:
0 0 15px rgba(255,215,140,.8),
0 0 40px rgba(255,215,140,.4);
display:flex;
align-items:center;
justify-content:center;
}

.qr-box img{
width:100%;
height:100%;
object-fit:contain;
}

.qr-title{
font-size:46px;
font-family:Georgia, serif;
margin-top:18px;
}

.qr-subtitle{
letter-spacing:.18em;
font-size:13px;
color:var(--gold-light);
margin-top:4px;
}

/* BUTTONS */

.nav{
margin-top:auto;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:18px;
padding-bottom:25px;
}

.card{
background:rgba(6,11,18,.85);
border:2px solid rgba(232,192,122,.8);
border-radius:24px;
height:180px;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

cursor:pointer;
transition:.2s;
}

.card:hover{
transform:translateY(-4px);
}

.card-icon{
font-size:60px;
margin-bottom:18px;
}

.card-title{
font-size:30px;
font-weight:600;
color:var(--gold-light);
}

/* MOBILE */

@media(max-width:850px){

.info-row{
flex-direction:column;
gap:15px;
}

.nav{
grid-template-columns:repeat(2,1fr);
}

.brand{
font-size:42px;
}

.welcome{
font-size:34px;
}

.time{
font-size:54px;
}

.temperature{
font-size:46px;
}

}

</style>
</head>

<body>

<div class="kiosk">

<div class="container">

<div class="logo-wrap">

<div class="logo">

<div class="logo-c"></div>

<svg class="logo-home"
viewBox="0 0 64 64"
fill="none"
stroke="currentColor"
stroke-width="5">

<path d="M8 30L32 10L56 30"/>
<path d="M16 27V54H48V27"/>
<path d="M27 54V37H37V54"/>

</svg>

</div>

<div class="brand">CAMPBELL</div>

<div class="subtitle">HOME CONCIERGE</div>

<div class="slogan">I'm Here To Help.</div>

</div>

<div class="info-row">

<div>
<div class="time" id="time"></div>
<div class="date" id="date"></div>
</div>

<div class="weather">
<div class="weather-icon">☁</div>

<div>
<div class="temperature">72°F</div>
<div class="weather-text">Mostly Clear</div>
</div>
</div>

</div>

<div class="welcome">
Welcome Home, Guest
</div>

<div class="qr-section">

<div class="qr-box">

wifi-qr.png.jpg

</div>

<div class="qr-title">
Scan for Wi‑Fi
</div>

<div class="qr-subtitle">
STAY CONNECTED. STAY AT HOME.
</div>

</div>

<div class="nav">

<div class="card">
<div class="card-icon">🏠</div>
<div class="card-title">Home</div>
</div>

<div class="card">
<div class="card-icon">🧺</div>
<div class="card-title">Housekeeping</div>
</div>

<div class="card">
<div class="card-icon">🔧</div>
<div class="card-title">Maintenance</div>
</div>

<div class="card">
<div class="card-icon">🚪</div>
<div class="card-title">Check Out</div>
</div>

</div>

</div>

</div>

<script>

function updateClock(){

const now=new Date();

document.getElementById("time").innerHTML=
now.toLocaleTimeString('en-US',{
hour:'numeric',
minute:'2-digit'
});

document.getElementById("date").innerHTML=
now.toLocaleDateString('en-US',{
weekday:'long',
month:'long',
day:'numeric'
});

}

updateClock();
setInterval(updateClock,1000);

</script>

</body>
</html>
