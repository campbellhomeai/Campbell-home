<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#101010"
  >

  <title>Campbell Home Concierge</title>

  <style>
    :root {
      --gold: #e4bd78;
      --white: #ffffff;
      --glass: rgba(15, 18, 23, 0.68);
      --glass-dark: rgba(15, 18, 23, 0.94);
      --border: rgba(255, 255, 255, 0.34);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;

      background-color: #121212;

      background-image:
        linear-gradient(
          180deg,
          rgba(6, 8, 12, 0.30),
          rgba(6, 8, 12, 0.68)
        ),
        url("nyc-sunset.jpg.PNG");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    button {
      font-family: inherit;
    }

    .kiosk {
      width: 100%;
      height: 100%;
      padding: 22px 36px;

      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
    }

    /* HEADER */

    .header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
    }

    .clock {
      text-align: left;
    }

    #time {
      font-size: clamp(38px, 5vw, 68px);
      font-weight: 300;
      line-height: 1;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.6);
    }

    #date {
      margin-top: 8px;
      font-size: clamp(15px, 1.8vw, 23px);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    .branding {
      text-align: center;
    }

    .logo {
      width: 62px;
      height: 62px;
      margin: 0 auto 7px;

      border: 3px solid var(--gold);
      border-right-color: transparent;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--gold);
      background: rgba(10, 12, 16, 0.38);

      font-family: Georgia, "Times New Roman", serif;
      font-size: 37px;
      font-weight: bold;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .brand-name {
      font-size: clamp(18px, 2.4vw, 31px);
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.7);
    }

    .slogan {
      margin-top: 4px;
      color: var(--gold);
      font-size: clamp(10px, 1.2vw, 14px);
      letter-spacing: 1.8px;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    .weather {
      justify-self: end;
      text-align: right;
    }

    #temperature {
      font-size: clamp(38px, 5vw, 65px);
      font-weight: 300;
      line-height: 1;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.6);
    }

    .weather-location {
      margin-top: 8px;
      font-size: clamp(14px, 1.6vw, 20px);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    /* CENTER */

    .main-content {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .welcome {
      margin: 0 0 13px;

      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 4vw, 54px);
      font-weight: normal;

      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.72);
    }

    .qr-card {
      width: clamp(180px, 21vw, 250px);
      height: clamp(180px, 21vw, 250px);
      margin: 0 auto;

      padding: 8px;
      border-radius: 23px;

      background: white;
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.48);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      border-radius: 15px;
    }

    .qr-placeholder {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 3px dashed #222;
      border-radius: 15px;

      color: #111;
      font-size: 22px;
      font-weight: bold;
    }

    .scan-text {
      margin-top: 12px;
      font-size: clamp(17px, 1.8vw, 22px);
      font-weight: bold;
      letter-spacing: 0.5px;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.8);
    }

    /* BOTTOM NAVIGATION */

    .navigation {
      width: min(100%, 1050px);
      margin: 0 auto;

      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .nav-button {
      min-height: 82px;
      padding: 10px;

      border: 1px solid var(--border);
      border-radius: 18px;

      color: white;
      background: var(--glass);

      cursor: pointer;
      touch-action: manipulation;

      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);

      box-shadow: 0 10px 29px rgba(0, 0, 0, 0.3);

      transition:
        transform 0.15s ease,
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .nav-button:hover,
    .nav-button:focus {
      border-color: var(--gold);
      outline: none;
    }

    .nav-button:active {
      transform: scale(0.96);
      background: rgba(228, 189, 120, 0.62);
    }

    .nav-icon {
      display: block;
      margin-bottom: 5px;
      font-size: 29px;
    }

    .nav-label {
      font-size: clamp(14px, 1.6vw, 19px);
    }

    /* POPUP SERVICE PANELS */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background: rgba(0, 0, 0, 0.76);

      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
    }

    .overlay.open {
      display: flex;
    }

    .service-panel {
      width: min(92vw, 560px);
      max-height: 88vh;
      overflow-y: auto;

      padding: 29px;

      border: 1px solid var(--border);
      border-radius: 25px;

      color: white;
      background: var(--glass-dark);

      text-align: center;
      box-shadow: 0 24px 65px rgba(0, 0, 0, 0.62);
    }

    .panel-icon {
      font-size: 43px;
    }

    .service-panel h2 {
      margin: 10px 0 8px;
      color: var(--gold);
      font-size: 30px;
    }

    .service-panel p {
      margin: 0 0 18px;
      font-size: 17px;
      line-height: 1.5;
      opacity: 0.94;
    }

    .service-options {
      display: grid;
      gap: 10px;
    }

    .option-button {
      width: 100%;
      padding: 15px;

      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 13px;

      background: #353840;
      color: white;

      font-size: 17px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .option-button:active {
      background: var(--gold);
      color: #151515;
    }

    .close-button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;

      border: none;
      border-radius: 13px;

      background: var(--gold);
      color: #151515;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;
      touch-action: manipulation;
    }

    /* TABLET RESPONSIVENESS */

    @media (max-width: 800px) {
      .kiosk {
        padding: 17px;
      }

      .header {
        grid-template-columns: 1fr 1fr;
      }

      .branding {
        grid-column: 1 / -1;
        grid-row: 1;
        margin-bottom: 12px;
      }

      .clock {
        grid-column: 1;
        grid-row: 2;
      }

      .weather {
        grid-column: 2;
        grid-row: 2;
      }

      .navigation {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-height: 650px) {
      .kiosk {
        padding-top: 12px;
        padding-bottom: 12px;
      }

      .logo {
        width: 48px;
        height: 48px;
        font-size: 29px;
      }

      .welcome {
        font-size: 30px;
      }

      .qr-card {
        width: 160px;
        height: 160px;
      }

      .nav-button {
        min-height: 65px;
      }
    }
  </style>
</head>

<body>

  <div class="kiosk">

    <header class="header">

      <section class="clock">
        <div id="time">--:--</div>
        <div id="date">Loading date</div>
      </section>

      <section class="branding">
        <div class="logo">C</div>
        <div class="brand-name">Campbell Home Concierge</div>
        <div class="slogan">Welcome Home. Anywhere.</div>
      </section>

      <section class="weather">
        <div id="temperature">--°F</div>
        <div class="weather-location">New York City</div>
      </section>

    </header>

    <main class="main-content">

      <div>
        <!-- Change "Guest" to the guest's first name -->
        <h1 class="welcome">
          Welcome Home, Guest
        </h1>

        <div class="qr-card">

          <!--
            OPTION 1:
            Upload a real QR image named wifi-qr.png.jpg.
            Then remove the placeholder below and use:

            <img
              src="wifi-qr.png.jpg"
              alt="Scan for Wi-Fi"
              class="qr-image"
            >
          -->

          <div class="qr-card">
            wifi-qr.png.jpg
          </div>

        </div>

        <div class="scan-text">
          Scan Here for Wi-Fi
        </div>
      </div>

    </main>

    <nav class="navigation">

      <button
        class="nav-button"
        onclick="openService('home')"
      >
        <span class="nav-icon">⌂</span>
        <span class="nav-label">Home</span>
      </button>

      <button
        class="nav-button"
        onclick="openService('housekeeping')"
      >
        <span class="nav-icon">🧹</span>
        <span class="nav-label">Housekeeping</span>
      </button>

      <button
        class="nav-button"
        onclick="openService('maintenance')"
      >
        <span class="nav-icon">🔧</span>
        <span class="nav-label">Maintenance</span>
      </button>

      <button
        class="nav-button"
        onclick="openService('checkout')"
      >
        <span class="nav-icon">🚪</span>
        <span class="nav-label">Check Out</span>
      </button>

    </nav>

  </div>

  <div
    class="overlay"
    id="serviceOverlay"
    onclick="closeFromBackground(event)"
  >

    <section class="service-panel">

      <div
        class="panel-icon"
        id="panelIcon"
      >
        ⌂
      </div>

      <h2 id="panelTitle">
        Home
      </h2>

      <p id="panelDescription">
        Welcome to Campbell Home.
      </p>

      <div
        class="service-options"
        id="serviceOptions"
      ></div>

      <button
        class="close-button"
        onclick="closeService()"
      >
        Return to Home
      </button>

    </section>

  </div>

  <script>
    const services = {
      home: {
        icon: "⌂",
        title: "Home",
        description:
          "Access property information and guest resources.",
        options: [
          "Wi-Fi Information",
          "House Manual",
          "Contact Host",
          "Local Recommendations"
        ]
      },

      housekeeping: {
        icon: "🧹",
        title: "Housekeeping",
        description:
          "Select the housekeeping service you need.",
        options: [
          "Fresh Towels",
          "Fresh Linens",
          "Additional Cleaning",
          "Toiletries or Supplies"
        ]
      },

      maintenance: {
        icon: "🔧",
        title: "Maintenance",
        description:
          "Select the issue that needs attention.",
        options: [
          "Heating or Cooling",
          "Plumbing",
          "Electrical",
          "Appliance",
          "Other Issue"
        ]
      },

      checkout: {
        icon: "🚪",
        title: "Check Out",
        description:
          "Review departure information and checkout options.",
        options: [
          "Checkout Instructions",
          "Request Late Checkout",
          "Key Return Instructions",
          "Confirm Departure"
        ]
      }
    };

    function updateClock() {
      const now = new Date();

      document.getElementById("time").textContent =
        new Intl.DateTimeFormat("en-US", {
          timeZone: "America/New_York",
          hour: "numeric",
          minute: "2-digit"
        }).format(now);

      document.getElementById("date").textContent =
        new Intl.DateTimeFormat("en-US", {
          timeZone: "America/New_York",
          weekday: "long",
          month: "long",
          day: "numeric"
        }).format(now);
    }

    async function updateWeather() {
      const temperatureElement =
        document.getElementById("temperature");

      try {
        const weatherURL =
          "https://api.open-meteo.com/v1/forecast" +
          "?latitude=40.7128" +
          "&longitude=-74.0060" +
          "&current=temperature_2m" +
          "&temperature_unit=fahrenheit" +
          "&timezone=America%2FNew_York";

        const response = await fetch(weatherURL);

        if (!response.ok) {
          throw new Error("Weather request failed");
        }

        const weatherData = await response.json();

        const temperature =
          Math.round(weatherData.current.temperature_2m);

        temperatureElement.textContent =
          temperature + "°F";

      } catch (error) {
        temperatureElement.textContent = "NYC";
      }
    }

    function openService(serviceName) {
      const service = services[serviceName];

      document.getElementById("panelIcon").textContent =
        service.icon;

      document.getElementById("panelTitle").textContent =
        service.title;

      document.getElementById("panelDescription").textContent =
        service.description;

      const optionsContainer =
        document.getElementById("serviceOptions");

      optionsContainer.innerHTML = "";

      service.options.forEach(function(optionName) {
        const button = document.createElement("button");

        button.className = "option-button";
        button.textContent = optionName;

        button.onclick = function() {
          alert(
            optionName +
            " selected. Connect this button to your request form next."
          );
        };

        optionsContainer.appendChild(button);
      });

      document
        .getElementById("serviceOverlay")
        .classList.add("open");
    }

    function closeService() {
      document
        .getElementById("serviceOverlay")
        .classList.remove("open");
    }

    function closeFromBackground(event) {
      if (event.target.id === "serviceOverlay") {
        closeService();
      }
    }

    updateClock();
    setInterval(updateClock, 1000);

    updateWeather();
    setInterval(updateWeather, 15 * 60 * 1000);
  </script>

</body>
</html>
