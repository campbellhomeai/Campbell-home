<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Campbell Home Concierge</title>

https://fonts.googleapis.com
https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&display=swap

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    background:url('background.jpg') center center/cover no-repeat;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
}

.container{
    position:relative;
    z-index:2;
    width:100%;
    max-width:900px;
    text-align:center;
}

.logo{
    font-family:'Cinzel',serif;
    color:#e9c77f;
    font-size:58px;
    letter-spacing:4px;
}

.subtitle{
    color:white;
    letter-spacing:3px;
    font-size:12px;
    margin-top:5px;
    margin-bottom:20px;
}

.welcome{
    font-family:'Cinzel',serif;
    font-size:42px;
    margin-bottom:25px;
}

.voice-card{
    background:rgba(8,15,32,.9);
    border:2px solid #dcb96e;
    border-radius:30px;
    padding:35px;
    backdrop-filter:blur(12px);
}

.voice-title{
    color:#f5ddb0;
    font-family:'Cinzel',serif;
    font-size:34px;
    margin-bottom:30px;
}

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:25px;
    flex-wrap:wrap;
}

.mic-btn{
    width:170px;
    height:170px;
    border-radius:50%;
    border:4px solid #f5ddb0;
    background:transparent;
    color:#f5ddb0;
    cursor:pointer;
    transition:.3s;
}

.mic-btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px rgba(245,221,176,.5);
}

.mic-icon{
    font-size:60px;
}

.tap-label{
    margin-top:5px;
    font-size:15px;
    font-weight:600;
}

.replay-btn{
    padding:15px 28px;
    border-radius:30px;
    border:2px solid #dcb96e;
    background:transparent;
    color:white;
    cursor:pointer;
    font-size:16px;
}

.response-box{
    text-align:left;
    margin-top:30px;
    border:1px solid rgba(255,255,255,.25);
    border-radius:18px;
    padding:20px;
    background:rgba(255,255,255,.04);
}

.response-label{
    color:#f5ddb0;
    font-weight:700;
    margin-right:10px;
}

.response-text{
    color:white;
    line-height:1.8;
}

.quick-actions{
    margin-top:25px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.action{
    background:rgba(8,15,32,.9);
    border:2px solid #dcb96e;
    border-radius:20px;
    padding:20px;
    color:white;
}

.action-icon{
    font-size:40px;
    margin-bottom:10px;
}

.action-title{
    font-size:18px;
    font-weight:600;
}

@media(max-width:768px){

    .quick-actions{
        grid-template-columns:repeat(2,1fr);
    }

    .logo{
        font-size:40px;
    }

    .welcome{
        font-size:30px;
    }

}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="container">

    <div class="logo">CAMPBELL</div>
    <div class="subtitle">HOME CONCIERGE</div>

    <div class="welcome">
        Welcome Home, Guest
    </div>

    <div class="voice-card">

        <div class="voice-title">
            Speak with Campbell
        </div>

        <div class="controls">

            <button id="micButton" class="mic-btn">
                <div class="mic-icon">🎤</div>
                <div class="tap-label">TAP TO TALK</div>
            </button>

            <button id="replayButton" class="replay-btn">
                Replay Answer
            </button>

        </div>

        <div class="response-box">
            <span class="response-label">CAMPBELL</span>
            <span id="responseText" class="response-text">
                Tap the microphone to begin.
            </span>
        </div>

    </div>

    <div class="quick-actions">

        <div class="action">
            <div class="action-icon">🏠</div>
            <div class="action-title">Home</div>
        </div>

        <div class="action">
            <div class="action-icon">🛏️</div>
            <div class="action-title">Housekeeping</div>
        </div>

        <div class="action">
            <div class="action-icon">🔧</div>
            <div class="action-title">Maintenance</div>
        </div>

        <div class="action">
            <div class="action-icon">🚪</div>
            <div class="action-title">Check Out</div>
        </div>

    </div>

</div>

<script>

const welcomeMessage =
"Hello, I'm Campbell and I'm here to help you throughout your stay. You may ask questions by tapping the microphone, or get additional information by tapping each icon below.";

const micButton = document.getElementById('micButton');
const replayButton = document.getElementById('replayButton');
const responseText = document.getElementById('responseText');

function speakWelcome() {

    responseText.textContent = welcomeMessage;

    speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(welcomeMessage);

    speech.rate = 0.95;
    speech.pitch = 1;
    speech.volume = 1;

    const voices = window.speechSynthesis.getVoices();

    const preferredVoice =
        voices.find(v => v.name.includes('Samantha')) ||
        voices.find(v => v.name.includes('Google')) ||
        voices.find(v => v.lang.startsWith('en'));

    if(preferredVoice){
        speech.voice = preferredVoice;
    }

    speechSynthesis.speak(speech);

    // Optional:
    // Start voice recognition after greeting finishes
    // speech.onend = () => recognition.start();
}

micButton.addEventListener('click', () => {
    speakWelcome();
});

replayButton.addEventListener('click', () => {
    speakWelcome();
});

window.speechSynthesis.onvoiceschanged = () => {};

</script>

</body>
</html>
