<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#090d18"
    >

    <title>Campbell Home Concierge</title>

    <style>
        :root {
            --campbell-gold: #e5c16d;
            --campbell-gold-light: #f2d990;
            --panel-dark: rgba(7, 11, 24, 0.92);
            --panel-dark-soft: rgba(7, 11, 24, 0.78);
            --text-light: #ffffff;
            --safe-bottom: max(28px, env(safe-area-inset-bottom));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            color: var(--text-light);
            font-family: Georgia, "Times New Roman", serif;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.16),
                    rgba(0, 0, 0, 0.38)
                ),
                url("nyc-sunset.jpg.PNG") center center / cover no-repeat fixed;
        }

        button {
            font: inherit;
        }

        button:focus-visible {
            outline: 4px solid white;
            outline-offset: 4px;
        }

        .app {
            position: relative;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            padding:
                18px
                22px
                calc(178px + var(--safe-bottom));

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ==============================
           CAMPBELL BRANDING
        ============================== */

        .brand {
            text-align: center;
            line-height: 1;
        }

        .brand-mark {
            width: 138px;
            height: 118px;
            display: block;
            margin: 0 auto -6px;
            filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.45));
        }

        /*
          The C uses a substantially thicker stroke than the house.
          This makes the C feel sturdy and dominant.
        */

        .logo-c {
            fill: none;
            stroke: var(--campbell-gold);
            stroke-width: 17;
            stroke-linecap: square;
            stroke-linejoin: miter;
        }

        .logo-house {
            fill: none;
            stroke: var(--campbell-gold);
            stroke-width: 4.5;
            stroke-linecap: square;
            stroke-linejoin: miter;
        }

        .logo-door {
            fill: none;
            stroke: var(--campbell-gold);
            stroke-width: 3.6;
            stroke-linecap: square;
            stroke-linejoin: miter;
        }

        .brand-name {
            color: var(--campbell-gold);
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(42px, 5vw, 64px);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.55);
        }

        .brand-subtitle {
            margin-top: 5px;
            font-size: clamp(13px, 1.5vw, 18px);
            font-weight: 700;
            letter-spacing: 0.32em;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.75);
        }

        .brand-helper {
            margin-top: 7px;
            font-size: clamp(16px, 1.8vw, 21px);
            font-weight: 700;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.75);
        }

        /* ==============================
           TIME AND WEATHER
        ============================== */

        .status-row {
            width: min(1120px, 94%);
            margin-top: 14px;

            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 30px;
        }

        .clock-panel {
            text-align: left;
        }

        .weather-panel {
            text-align: right;
        }

        .status-primary {
            font-size: clamp(46px, 7vw, 78px);
            line-height: 1;
            font-weight: 400;
            text-shadow: 0 3px 7px rgba(0, 0, 0, 0.8);
        }

        .status-secondary {
            margin-top: 8px;
            font-size: clamp(17px, 2.2vw, 27px);
            font-weight: 700;
            text-shadow: 0 3px 7px rgba(0, 0, 0, 0.8);
        }

        /* ==============================
           MAIN CONTENT
        ============================== */

        .welcome {
            margin-top: 18px;
            text-align: center;
            font-size: clamp(42px, 6.1vw, 72px);
            line-height: 1.05;
            font-weight: 700;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.85);
        }

        .qr-shell {
            width: 256px;
            height: 256px;
            margin-top: 20px;
            padding: 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;
            border: 4px solid var(--campbell-gold);
            border-radius: 25px;

            box-shadow:
                0 0 0 2px rgba(255, 255, 255, 0.28),
                0 10px 35px rgba(0, 0, 0, 0.42);
        }

        #wifiQR {
            width: 220px;
            height: 220px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;
            overflow: hidden;
        }

        #wifiQR canvas,
        #wifiQR img,
        #wifiQR table {
            display: block;
            width: 220px !important;
            height: 220px !important;
            margin: 0 !important;
        }

        .qr-fallback {
            padding: 16px;
            color: #111111;
            font-family: Arial, sans-serif;
            font-size: 15px;
            line-height: 1.4;
            text-align: center;
        }

        .wifi-label {
            margin-top: 12px;
            font-size: clamp(30px, 4vw, 46px);
            text-align: center;
            text-shadow: 0 3px 7px rgba(0, 0, 0, 0.8);
        }

        /* ==============================
           CAMPBELL MICROPHONE
        ============================== */

        .voice-area {
            margin-top: 18px;
            text-align: center;
        }

        .microphone-button {
            width: 116px;
            height: 116px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border: 4px solid var(--campbell-gold);
            border-radius: 50%;

            background: rgba(6, 9, 18, 0.78);
            color: var(--campbell-gold);

            cursor: pointer;
            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.38),
                inset 0 0 18px rgba(229, 193, 109, 0.08);

            transition:
                transform 160ms ease,
                box-shadow 160ms ease,
                background 160ms ease;
        }

        .microphone-button:hover {
            transform: scale(1.045);
            background: rgba(10, 15, 30, 0.94);
            box-shadow:
                0 0 24px rgba(229, 193, 109, 0.5),
                0 8px 20px rgba(0, 0, 0, 0.42);
        }

        .microphone-button.listening {
            animation: microphonePulse 1.1s infinite;
        }

        .microphone-icon {
            width: 48px;
            height: 48px;
            fill: none;
            stroke: currentColor;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes microphonePulse {
            0% {
                box-shadow: 0 0 0 0 rgba(229, 193, 109, 0.7);
            }

            70% {
                box-shadow: 0 0 0 22px rgba(229, 193, 109, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(229, 193, 109, 0);
            }
        }

        .speak-label {
            margin-top: 10px;
            font-size: clamp(28px, 3.7vw, 43px);
            text-shadow: 0 3px 7px rgba(0, 0, 0, 0.85);
        }

        .assistant-message {
            width: min(900px, 92vw);
            margin-top: 12px;
            padding: 12px 18px;

            background: rgba(5, 8, 17, 0.66);
            border: 1px solid rgba(229, 193, 109, 0.42);
            border-radius: 13px;

            font-family: Arial, sans-serif;
            font-size: clamp(14px, 1.8vw, 19px);
            font-weight: 700;
            line-height: 1.45;
            text-align: left;

            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(5px);
        }

        /* ==============================
           BOTTOM NAVIGATION
        ============================== */

        .bottom-navigation {
            position: absolute;
            left: 50%;
            bottom: calc(24px + var(--safe-bottom));
            transform: translateX(-50%);

            width: min(1220px, 95%);
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 13px;
        }

        .navigation-card {
            min-height: 128px;
            padding: 18px 9px 15px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;

            color: white;
            background: var(--panel-dark);
            border: 3px solid var(--campbell-gold);
            border-radius: 22px;

            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.38);
            cursor: pointer;

            transition:
                transform 150ms ease,
                background 150ms ease,
                box-shadow 150ms ease;
        }

        .navigation-card:hover,
        .navigation-card:focus-visible {
            transform: translateY(-5px);
            background: rgba(17, 24, 45, 0.97);
            box-shadow:
                0 0 20px rgba(229, 193, 109, 0.35),
                0 10px 24px rgba(0, 0, 0, 0.44);
        }

        .navigation-icon {
            width: 45px;
            height: 45px;
            fill: none;
            stroke: var(--campbell-gold);
            stroke-width: 2.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .navigation-label {
            font-size: clamp(14px, 1.7vw, 20px);
            font-weight: 700;
            line-height: 1.1;
            text-align: center;
        }

        /* ==============================
           INFORMATION SCREENS
        ============================== */

        .information-screen {
            position: fixed;
            inset: 0;
            z-index: 1000;

            display: none;
            overflow-y: auto;

            color: white;
            background:
                linear-gradient(
                    rgba(4, 7, 16, 0.92),
                    rgba(4, 7, 16, 0.96)
                ),
                url("nyc-sunset.jpg.PNG") center center / cover no-repeat;
        }

        .information-screen.open {
            display: block;
        }

        .information-content {
            width: min(1080px, 92%);
            min-height: 100%;
            margin: 0 auto;
            padding:
                35px
                0
                calc(50px + var(--safe-bottom));
        }

        .information-header {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 30px;
        }

        .back-button {
            flex: 0 0 auto;
            padding: 13px 20px;

            color: #111111;
            background: var(--campbell-gold);
            border: 0;
            border-radius: 12px;

            font-family: Arial, sans-serif;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
        }

        .information-title {
            color: var(--campbell-gold);
            font-size: clamp(35px, 5vw, 58px);
            line-height: 1;
        }

        .information-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .information-card {
            min-height: 155px;
            padding: 22px;

            background: rgba(11, 16, 32, 0.9);
            border: 2px solid rgba(229, 193, 109, 0.78);
            border-radius: 18px;

            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.34);
        }

        .information-card h3 {
            margin-bottom: 12px;
            color: var(--campbell-gold);
            font-size: 25px;
        }

        .information-card p,
        .information-card li {
            font-family: Arial, sans-serif;
            font-size: 18px;
            line-height: 1.6;
        }

        .information-card ul {
            padding-left: 21px;
        }

        .information-note {
            margin-top: 24px;
            padding: 17px;

            background: rgba(229, 193, 109, 0.12);
            border-left: 5px solid var(--campbell-gold);
            border-radius: 8px;

            font-family: Arial, sans-serif;
            font-size: 17px;
            line-height: 1.55;
        }

        /* ==============================
           RESPONSIVE TABLET LAYOUT
        ============================== */

        @media (max-width: 900px) {
            .app {
                padding-left: 14px;
                padding-right: 14px;
                padding-bottom: calc(164px + var(--safe-bottom));
            }

            .brand-mark {
                width: 118px;
                height: 100px;
            }

            .status-row {
                width: 95%;
            }

            .qr-shell {
                width: 230px;
                height: 230px;
            }

            #wifiQR,
            #wifiQR canvas,
            #wifiQR img,
            #wifiQR table {
                width: 198px !important;
                height: 198px !important;
            }

            .bottom-navigation {
                gap: 8px;
            }

            .navigation-card {
                min-height: 116px;
                padding: 14px 5px 12px;
                border-radius: 18px;
            }

            .navigation-icon {
                width: 38px;
                height: 38px;
            }
        }

        @media (max-width: 670px) {
            .status-primary {
                font-size: 39px;
            }

            .status-secondary {
                font-size: 15px;
            }

            .welcome {
                font-size: 36px;
            }

            .bottom-navigation {
                gap: 5px;
            }

            .navigation-card {
                min-height: 102px;
                border-width: 2px;
            }

            .navigation-icon {
                width: 31px;
                height: 31px;
            }

            .navigation-label {
                font-size: 12px;
            }

            .information-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <main class="app" id="mainScreen">

        <!-- Campbell logo -->
        <header class="brand">

            <svg
                class="brand-mark"
                viewBox="0 0 150 130"
                role="img"
                aria-label="Campbell Home logo"
            >
                <!-- Strong, foundational C -->
                <path
                    class="logo-c"
                    d="
                        M119 24
                        C99 11 68 8 45 21
                        C22 34 14 57 18 80
                        C22 105 42 119 68 120
                        C89 121 107 112 121 96
                    "
                />

                <!-- Geometric house filling the opening -->
                <path
                    class="logo-house"
                    d="
                        M46 63
                        L72 39
                        L98 63
                    "
                />

                <path
                    class="logo-house"
                    d="
                        M51 61
                        L51 93
                        L93 93
                        L93 61
                    "
                />

                <path
                    class="logo-door"
                    d="
                        M67 93
                        L67 70
                        L78 70
                        L78 93
                    "
                />
            </svg>

            <div class="brand-name">CAMPBELL</div>
            <div class="brand-subtitle">HOME CONCIERGE</div>
            <div class="brand-helper">I'M HERE TO HELP.</div>

        </header>

        <!-- Time and weather -->
        <section class="status-row" aria-label="Time and weather">

            <div class="clock-panel">
                <div class="status-primary" id="clock">12:00 AM</div>
                <div class="status-secondary" id="date">
                    Monday, October 12
                </div>
            </div>

            <div class="weather-panel">
                <div class="status-primary">72°F</div>
                <div class="status-secondary">Mostly Clear</div>
            </div>

        </section>

        <h1 class="welcome">Welcome Home, Guest</h1>

        <!-- JavaScript-generated Wi-Fi QR -->
        <section aria-label="Wi-Fi connection">

            <div class="qr-shell">
                <div id="wifiQR" aria-label="Wi-Fi QR code"></div>
            </div>

            <div class="wifi-label">Connect to Wi-Fi</div>

        </section>

        <!-- Campbell microphone -->
        <section class="voice-area" aria-label="Speak with Campbell">

            <button
                type="button"
                class="microphone-button"
                id="microphoneButton"
                aria-label="Speak with Campbell"
            >
                <svg
                    class="microphone-icon"
                    viewBox="0 0 48 48"
                    aria-hidden="true"
                >
                    <rect
                        x="17"
                        y="5"
                        width="14"
                        height="25"
                        rx="7"
                    ></rect>

                    <path d="M11 23 C11 32 16 37 24 37 C32 37 37 32 37 23"></path>
                    <path d="M24 37 V44"></path>
                    <path d="M17 44 H31"></path>
                </svg>
            </button>

            <div class="speak-label">Speak with Campbell</div>

            <div class="assistant-message" id="assistantMessage">
                What can Campbell help you with today?
            </div>

        </section>

        <!-- Bottom navigation -->
        <nav class="bottom-navigation" aria-label="Guest services">

            <button
                type="button"
                class="navigation-card"
                data-section="home"
            >
                <svg class="navigation-icon" viewBox="0 0 48 48">
                    <path d="M6 23 L24 7 L42 23"></path>
                    <path d="M10 21 V42 H38 V21"></path>
                    <path d="M20 42 V29 H28 V42"></path>
                </svg>

                <span class="navigation-label">Home</span>
            </button>

            <button
                type="button"
                class="navigation-card"
                data-section="checkin"
            >
                <svg class="navigation-icon" viewBox="0 0 48 48">
                    <rect x="7" y="6" width="34" height="36" rx="4"></rect>
                    <path d="M14 25 L21 32 L35 16"></path>
                </svg>

                <span class="navigation-label">Check In</span>
            </button>

            <button
                type="button"
                class="navigation-card"
                data-section="housekeeping"
            >
                <svg class="navigation-icon" viewBox="0 0 48 48">
                    <path d="M9 20 C12 37 16 41 24 41 C32 41 36 37 39 20"></path>
                    <path d="M7 20 H41"></path>
                    <path d="M13 20 L18 8"></path>
                    <path d="M23 20 V7"></path>
                    <path d="M35 20 L30 8"></path>
                    <path d="M13 28 H35"></path>
                </svg>

                <span class="navigation-label">Housekeeping</span>
            </button>

            <button
                type="button"
                class="navigation-card"
                data-section="maintenance"
            >
                <svg class="navigation-icon" viewBox="0 0 48 48">
                    <path d="M30 7 C26 11 26 17 30 21 L14 37 C12 39 12 42 14 44 C16 46 19 46 21 44 L37 28 C41 32 47 31 50 27"></path>
                    <circle cx="18" cy="40" r="2"></circle>
                </svg>

                <span class="navigation-label">Maintenance</span>
            </button>

            <button
                type="button"
                class="navigation-card"
                data-section="checkout"
            >
                <svg class="navigation-icon" viewBox="0 0 48 48">
                    <path d="M11 43 V6 H34 V43"></path>
                    <path d="M15 10 L31 13 V43 H15 Z"></path>
                    <circle cx="27" cy="28" r="1.7"></circle>
                    <path d="M34 24 H44"></path>
                    <path d="M40 20 L44 24 L40 28"></path>
                </svg>

                <span class="navigation-label">Check Out</span>
            </button>

        </nav>

    </main>

    <!-- Full-screen information page -->
    <section
        class="information-screen"
        id="informationScreen"
        aria-hidden="true"
    >
        <div class="information-content">

            <header class="information-header">

                <button
                    type="button"
                    class="back-button"
                    id="backButton"
                >
                    ← Back to Concierge
                </button>

                <h2 class="information-title" id="informationTitle">
                    Home
                </h2>

            </header>

            <div class="information-grid" id="informationGrid"></div>

            <div class="information-note" id="informationNote"></div>

        </div>
    </section>

    <!-- QRCode.js. This script does not display a URL on the page. -->
    https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.jsscript>

    <script>
        /*
         * ============================================================
         * PROPERTY SETTINGS
         * ============================================================
         * Change these three values to the real property Wi-Fi details.
         *
         * WIFI_SECURITY options:
         * WPA
         * WEP
         * nopass
         */

        const WIFI_NAME = "CampbellHome";
        const WIFI_PASSWORD = "ReplaceWithActualPassword";
        const WIFI_SECURITY = "WPA";

        /*
         * Escape characters that have a special meaning in Wi-Fi QR data.
         */
        function escapeWifiValue(value) {
            return String(value)
                .replace(/\\/g, "\\\\")
                .replace(/;/g, "\\;")
                .replace(/,/g, "\\,")
                .replace(/:/g, "\\:")
                .replace(/"/g, '\\"');
        }

        /*
         * Generate the Wi-Fi QR code.
         */
        function generateWifiQR() {
            const qrContainer = document.getElementById("wifiQR");

            const wifiData =
                "WIFI:T:" + escapeWifiValue(WIFI_SECURITY) +
                ";S:" + escapeWifiValue(WIFI_NAME) +
                ";P:" + escapeWifiValue(WIFI_PASSWORD) +
                ";;";

            qrContainer.innerHTML = "";

            if (typeof QRCode === "undefined") {
                qrContainer.innerHTML =
                    '<div class="qr-fallback">' +
                    "The QR generator did not load. " +
                    "Please check the internet connection and refresh." +
                    "</div>";

                return;
            }

            new QRCode(qrContainer, {
                text: wifiData,
                width: 220,
                height: 220,
                colorDark: "#080808",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        /*
         * Live clock and date.
         */
        function updateClock() {
            const now = new Date();

            document.getElementById("clock").textContent =
                now.toLocaleTimeString([], {
                    hour: "numeric",
                    minute: "2-digit"
                });

            document.getElementById("date").textContent =
                now.toLocaleDateString("en-US", {
                    weekday: "long",
                    month: "long",
                    day: "numeric"
                });
        }

        /*
         * Make Campbell speak.
         */
        function speakCampbell(text) {
            if (!("speechSynthesis" in window)) {
                return;
            }

            window.speechSynthesis.cancel();

            const message = new SpeechSynthesisUtterance(text);

            message.rate = 0.94;
            message.pitch = 0.92;
            message.volume = 1;

            window.speechSynthesis.speak(message);
        }

        /*
         * Microphone greeting.
         */
        const microphoneButton =
            document.getElementById("microphoneButton");

        const assistantMessage =
            document.getElementById("assistantMessage");

        microphoneButton.addEventListener("click", function () {
            const greeting =
                "Hello, I'm Campbell, and I'm here to help you " +
                "throughout your stay. You may ask questions by " +
                "tapping the microphone, or get additional information " +
                "by tapping each icon below.";

            assistantMessage.textContent = greeting;

            microphoneButton.classList.add("listening");

            speakCampbell(greeting);

            window.setTimeout(function () {
                microphoneButton.classList.remove("listening");
            }, 3200);
        });

        /*
         * Content for each full-screen guest-services page.
         * Replace the placeholder information with the property's
         * confirmed rules, contacts, instructions, and recommendations.
         */
        const sectionContent = {
            home: {
                title: "Home Information",
                spoken:
                    "Welcome to Home Information. Here you can review " +
                    "house rules, Wi-Fi access, local attractions, " +
                    "restaurants, transportation, and emergency contacts.",
                cards: [
                    {
                        title: "House Rules",
                        body:
                            "<ul>" +
                            "<li>No smoking inside the property.</li>" +
                            "<li>Observe posted quiet hours.</li>" +
                            "<li>Only registered guests may stay overnight.</li>" +
                            "<li>Report damage or safety concerns promptly.</li>" +
                            "</ul>"
                    },
                    {
                        title: "Wi-Fi",
                        body:
                            "<p><strong>Network:</strong> " +
                            WIFI_NAME +
                            "</p>" +
                            "<p>Return to the concierge screen to scan the QR code.</p>"
                    },
                    {
                        title: "Local Attractions",
                        body:
                            "<ul>" +
                            "<li>Central Park</li>" +
                            "<li>Times Square</li>" +

        const informationScreen =
            document.getElementById("informationScreen");

        const informationTitle =
            document.getElementById("informationTitle");

        const informationGrid =
            document.getElementById("informationGrid");

        const informationNote =
            document.getElementById("informationNote");

        /*
         * Open a full-screen information page.
         */
        function openInformationScreen(sectionName) {
            const section = sectionContent[sectionName];

            if (!section) {
                return;
            }

            informationTitle.textContent = section.title;

            informationGrid.innerHTML = section.cards
                .map(function (card) {
                    return (
                        '<article class="information-card">' +
                        "<h3>" + card.title + "</h3>" +
                        card.body +
                        "</article>"
                    );
                })
                .join("");

            informationNote.textContent = section.note;

            informationScreen.classList.add("open");
            informationScreen.setAttribute("aria-hidden", "false");

            document.body.style.overflow = "hidden";

            speakCampbell(section.spoken);
        }

        /*
         * Close the information page.
         */
        function closeInformationScreen() {
            informationScreen.classList.remove("open");
            informationScreen.setAttribute("aria-hidden", "true");

            document.body.style.overflow = "";

            if ("speechSynthesis" in window) {
                window.speechSynthesis.cancel();
            }
        }

        document
            .querySelectorAll(".navigation-card")
            .forEach(function (button) {
                button.addEventListener("click", function () {
                    openInformationScreen(button.dataset.section);
                });
            });

        document
            .getElementById("backButton")
            .addEventListener("click", closeInformationScreen);

        document.addEventListener("keydown", function (event) {
            if (
                event.key === "Escape" &&
                informationScreen.classList.contains("open")
            ) {
                closeInformationScreen();
            }
        });

        /*
         * Start the page.
         */
        updateClock();
        window.setInterval(updateClock, 1000);
        generateWifiQR();
